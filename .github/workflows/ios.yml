name: Apple Client

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ios/GraffitiGuard/**
      - scripts/export_coreml.py
      - pyproject.toml
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - ios/GraffitiGuard/**
      - scripts/export_coreml.py
      - pyproject.toml
      - .github/workflows/ios.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test iPhone and iPad app
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Check Swift formatting
        run: |
          xcrun swift-format lint \
            --strict \
            --recursive \
            --configuration ios/GraffitiGuard/.swift-format \
            ios/GraffitiGuard/GraffitiGuard \
            ios/GraffitiGuard/GraffitiGuardTests \
            ios/GraffitiGuard/GraffitiGuardUITests

      - name: Build universal simulator app
        run: |
          xcodebuild \
            -project ios/GraffitiGuard/GraffitiGuard.xcodeproj \
            -scheme GraffitiGuard \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/GraffitiGuardBuildDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build unsigned release app
        run: |
          xcodebuild \
            -project ios/GraffitiGuard/GraffitiGuard.xcodeproj \
            -scheme GraffitiGuard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/GraffitiGuardReleaseDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Select test simulators
        shell: bash
        run: |
          read -r iphone_id ipad_id < <(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          available = [
              (tuple(map(int, re.search(r"iOS-(\d+)-(\d+)", runtime).groups())), device)
              for runtime, runtime_devices in devices.items()
              if re.search(r"iOS-(\d+)-(\d+)", runtime)
              for device in runtime_devices
              if device.get("isAvailable")
          ]
          latest_runtime = max(version for version, _ in available)
          current = [device for version, device in available if version == latest_runtime]
          iphone = next(
              (device for device in current if device["name"] == "iPhone 17 Pro"),
              next(device for device in current if device["name"].startswith("iPhone")),
          )
          ipad = next(
              (device for device in current if device["name"].startswith("iPad Air 11-inch")),
              next(device for device in current if device["name"].startswith("iPad")),
          )
          print(
              "Selected iOS {}.{}: {} and {}".format(
                  latest_runtime[0], latest_runtime[1], iphone["name"], ipad["name"]
              ),
              file=sys.stderr,
          )
          print(iphone["udid"], ipad["udid"])
          ')
          test -n "$iphone_id"
          test -n "$ipad_id"
          echo "IPHONE_TEST_DEVICE_ID=$iphone_id" >> "$GITHUB_ENV"
          echo "IPAD_TEST_DEVICE_ID=$ipad_id" >> "$GITHUB_ENV"

      - name: Run iPhone and iPad tests
        run: |
          xcodebuild \
            -project ios/GraffitiGuard/GraffitiGuard.xcodeproj \
            -scheme GraffitiGuard \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPHONE_TEST_DEVICE_ID" \
            -destination "platform=iOS Simulator,id=$IPAD_TEST_DEVICE_ID" \
            -maximum-concurrent-test-simulator-destinations 1 \
            -derivedDataPath /tmp/GraffitiGuardTestDerivedData \
            -resultBundlePath /tmp/GraffitiGuardTests.xcresult \
            -enableCodeCoverage YES \
            test

      - name: Upload Apple test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-test-results-${{ github.run_attempt }}
          path: /tmp/GraffitiGuardTests.xcresult
          if-no-files-found: warn
          retention-days: 14
